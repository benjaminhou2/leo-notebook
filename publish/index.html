<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leo 学习资料发布中心</title>
  <meta name="description" content="Leo 各学科 HTML 学习资料的静态发布入口。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/portal.css">
</head>
<body>
  <main class="shell auth-shell" id="loginView">
    <section class="login-card" aria-label="登录">
      <p class="eyebrow">Leo 学习资料</p>
      <h1>登录发布中心</h1>
      <p class="summary">请输入账号和密码，登录成功后再进入各科学习资料。</p>
      <form class="login-form" id="loginForm">
        <label>
          <span>账号</span>
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
        <button type="submit">登录</button>
      </form>
    </section>
  </main>
  <main class="shell is-hidden" id="portalView">
    <header class="hero">
      <div class="hero-top">
        <p class="eyebrow">静态发布入口</p>
        <button class="logout-button" id="logoutButton" type="button">退出</button>
      </div>
      <h1>Leo 学习资料发布中心</h1>
      <p class="summary">这里用于集中访问各学科已经生成好的 HTML 学习资料。后续语文、数学、英文都可以从这里进入。</p>
      <p class="notice">公开发布前，请确认页面中是否包含 Leo 的姓名、作文原图、试卷照片或家庭信息。需要公网访问时，优先放在带登录门的学习门户后面。</p>
    </header>
    <section class="grid" aria-label="学科入口">
      <a class="card" href="./语文/index.html">
        <strong>语文</strong>
        <span>作文、阅读、试卷分析和专项提升练习。</span>
        <em>进入语文资料</em>
      </a>
      <a class="card" href="./数学/index.html">
        <strong>数学</strong>
        <span>数学错题讲解、知识点诊断和专项练习。</span>
        <em>进入数学资料</em>
      </a>
      <a class="card" href="./英文/index.html">
        <strong>英文</strong>
        <span>英文作业、阅读、词句积累和复习内容。</span>
        <em>进入英文资料</em>
      </a>
    </section>
  </main>
  <script src="./assets/access.js"></script>
  <script>
    const expectedUserHash = "0f759dd1ea6c4c76cedc299039ca4f23";
    const expectedPasswordHash = "ebeda3d88a92b27953e4eba3cbfb00cb";
    const authKey = "leo_publish_auth";
    let memoryAuth = false;

    function md5(input) {
      function rotateLeft(value, shift) {
        return (value << shift) | (value >>> (32 - shift));
      }

      function addUnsigned(a, b) {
        const a4 = a & 0x40000000;
        const b4 = b & 0x40000000;
        const a8 = a & 0x80000000;
        const b8 = b & 0x80000000;
        const result = (a & 0x3fffffff) + (b & 0x3fffffff);
        if (a4 & b4) return result ^ 0x80000000 ^ a8 ^ b8;
        if (a4 | b4) {
          if (result & 0x40000000) return result ^ 0xc0000000 ^ a8 ^ b8;
          return result ^ 0x40000000 ^ a8 ^ b8;
        }
        return result ^ a8 ^ b8;
      }

      function f(x, y, z) { return (x & y) | (~x & z); }
      function g(x, y, z) { return (x & z) | (y & ~z); }
      function h(x, y, z) { return x ^ y ^ z; }
      function i(x, y, z) { return y ^ (x | ~z); }

      function round(fn, a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(fn(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }

      function toWordArray(text) {
        const utf8 = unescape(encodeURIComponent(text));
        const messageLength = utf8.length;
        const wordCount = (((messageLength + 8) - ((messageLength + 8) % 64)) / 64 + 1) * 16;
        const words = new Array(wordCount - 1).fill(0);
        let bytePosition = 0;
        while (bytePosition < messageLength) {
          const wordIndex = (bytePosition - (bytePosition % 4)) / 4;
          words[wordIndex] |= utf8.charCodeAt(bytePosition) << ((bytePosition % 4) * 8);
          bytePosition += 1;
        }
        const wordIndex = (bytePosition - (bytePosition % 4)) / 4;
        words[wordIndex] |= 0x80 << ((bytePosition % 4) * 8);
        words[wordCount - 2] = messageLength << 3;
        words[wordCount - 1] = messageLength >>> 29;
        return words;
      }

      function wordToHex(value) {
        let output = "";
        for (let count = 0; count <= 3; count += 1) {
          const byte = (value >>> (count * 8)) & 255;
          output += `0${byte.toString(16)}`.slice(-2);
        }
        return output;
      }

      const x = toWordArray(input);
      let a = 0x67452301;
      let b = 0xefcdab89;
      let c = 0x98badcfe;
      let d = 0x10325476;

      for (let k = 0; k < x.length; k += 16) {
        const aa = a;
        const bb = b;
        const cc = c;
        const dd = d;

        a = round(f, a, b, c, d, x[k + 0], 7, 0xd76aa478);
        d = round(f, d, a, b, c, x[k + 1], 12, 0xe8c7b756);
        c = round(f, c, d, a, b, x[k + 2], 17, 0x242070db);
        b = round(f, b, c, d, a, x[k + 3], 22, 0xc1bdceee);
        a = round(f, a, b, c, d, x[k + 4], 7, 0xf57c0faf);
        d = round(f, d, a, b, c, x[k + 5], 12, 0x4787c62a);
        c = round(f, c, d, a, b, x[k + 6], 17, 0xa8304613);
        b = round(f, b, c, d, a, x[k + 7], 22, 0xfd469501);
        a = round(f, a, b, c, d, x[k + 8], 7, 0x698098d8);
        d = round(f, d, a, b, c, x[k + 9], 12, 0x8b44f7af);
        c = round(f, c, d, a, b, x[k + 10], 17, 0xffff5bb1);
        b = round(f, b, c, d, a, x[k + 11], 22, 0x895cd7be);
        a = round(f, a, b, c, d, x[k + 12], 7, 0x6b901122);
        d = round(f, d, a, b, c, x[k + 13], 12, 0xfd987193);
        c = round(f, c, d, a, b, x[k + 14], 17, 0xa679438e);
        b = round(f, b, c, d, a, x[k + 15], 22, 0x49b40821);

        a = round(g, a, b, c, d, x[k + 1], 5, 0xf61e2562);
        d = round(g, d, a, b, c, x[k + 6], 9, 0xc040b340);
        c = round(g, c, d, a, b, x[k + 11], 14, 0x265e5a51);
        b = round(g, b, c, d, a, x[k + 0], 20, 0xe9b6c7aa);
        a = round(g, a, b, c, d, x[k + 5], 5, 0xd62f105d);
        d = round(g, d, a, b, c, x[k + 10], 9, 0x02441453);
        c = round(g, c, d, a, b, x[k + 15], 14, 0xd8a1e681);
        b = round(g, b, c, d, a, x[k + 4], 20, 0xe7d3fbc8);
        a = round(g, a, b, c, d, x[k + 9], 5, 0x21e1cde6);
        d = round(g, d, a, b, c, x[k + 14], 9, 0xc33707d6);
        c = round(g, c, d, a, b, x[k + 3], 14, 0xf4d50d87);
        b = round(g, b, c, d, a, x[k + 8], 20, 0x455a14ed);
        a = round(g, a, b, c, d, x[k + 13], 5, 0xa9e3e905);
        d = round(g, d, a, b, c, x[k + 2], 9, 0xfcefa3f8);
        c = round(g, c, d, a, b, x[k + 7], 14, 0x676f02d9);
        b = round(g, b, c, d, a, x[k + 12], 20, 0x8d2a4c8a);

        a = round(h, a, b, c, d, x[k + 5], 4, 0xfffa3942);
        d = round(h, d, a, b, c, x[k + 8], 11, 0x8771f681);
        c = round(h, c, d, a, b, x[k + 11], 16, 0x6d9d6122);
        b = round(h, b, c, d, a, x[k + 14], 23, 0xfde5380c);
        a = round(h, a, b, c, d, x[k + 1], 4, 0xa4beea44);
        d = round(h, d, a, b, c, x[k + 4], 11, 0x4bdecfa9);
        c = round(h, c, d, a, b, x[k + 7], 16, 0xf6bb4b60);
        b = round(h, b, c, d, a, x[k + 10], 23, 0xbebfbc70);
        a = round(h, a, b, c, d, x[k + 13], 4, 0x289b7ec6);
        d = round(h, d, a, b, c, x[k + 0], 11, 0xeaa127fa);
        c = round(h, c, d, a, b, x[k + 3], 16, 0xd4ef3085);
        b = round(h, b, c, d, a, x[k + 6], 23, 0x04881d05);
        a = round(h, a, b, c, d, x[k + 9], 4, 0xd9d4d039);
        d = round(h, d, a, b, c, x[k + 12], 11, 0xe6db99e5);
        c = round(h, c, d, a, b, x[k + 15], 16, 0x1fa27cf8);
        b = round(h, b, c, d, a, x[k + 2], 23, 0xc4ac5665);

        a = round(i, a, b, c, d, x[k + 0], 6, 0xf4292244);
        d = round(i, d, a, b, c, x[k + 7], 10, 0x432aff97);
        c = round(i, c, d, a, b, x[k + 14], 15, 0xab9423a7);
        b = round(i, b, c, d, a, x[k + 5], 21, 0xfc93a039);
        a = round(i, a, b, c, d, x[k + 12], 6, 0x655b59c3);
        d = round(i, d, a, b, c, x[k + 3], 10, 0x8f0ccc92);
        c = round(i, c, d, a, b, x[k + 10], 15, 0xffeff47d);
        b = round(i, b, c, d, a, x[k + 1], 21, 0x85845dd1);
        a = round(i, a, b, c, d, x[k + 8], 6, 0x6fa87e4f);
        d = round(i, d, a, b, c, x[k + 15], 10, 0xfe2ce6e0);
        c = round(i, c, d, a, b, x[k + 6], 15, 0xa3014314);
        b = round(i, b, c, d, a, x[k + 13], 21, 0x4e0811a1);
        a = round(i, a, b, c, d, x[k + 4], 6, 0xf7537e82);
        d = round(i, d, a, b, c, x[k + 11], 10, 0xbd3af235);
        c = round(i, c, d, a, b, x[k + 2], 15, 0x2ad7d2bb);
        b = round(i, b, c, d, a, x[k + 9], 21, 0xeb86d391);

        a = addUnsigned(a, aa);
        b = addUnsigned(b, bb);
        c = addUnsigned(c, cc);
        d = addUnsigned(d, dd);
      }

      return `${wordToHex(a)}${wordToHex(b)}${wordToHex(c)}${wordToHex(d)}`.toLowerCase();
    }

    function showPortal() {
      document.getElementById("loginView").classList.add("is-hidden");
      document.getElementById("portalView").classList.remove("is-hidden");
    }

    function showLogin() {
      document.getElementById("portalView").classList.add("is-hidden");
      document.getElementById("loginView").classList.remove("is-hidden");
    }

    function getAuthState() {
      if (window.LeoAccess && window.LeoAccess.isAuthenticated()) return true;
      try {
        return sessionStorage.getItem(authKey) === "yes" || memoryAuth;
      } catch (error) {
        return memoryAuth;
      }
    }

    function setAuthState(value) {
      memoryAuth = value;
      if (window.LeoAccess) {
        if (value) window.LeoAccess.grantAccess();
        else window.LeoAccess.clearAccess();
      }
      try {
        if (value) {
          sessionStorage.setItem(authKey, "yes");
        } else {
          sessionStorage.removeItem(authKey);
        }
      } catch (error) {
        memoryAuth = value;
      }
    }

    function consumeLoginParams() {
      const params = new URLSearchParams(window.location.search);
      const username = params.get("username");
      const password = params.get("password");
      if (!username && !password) return;
      if (md5((username || "").trim()) === expectedUserHash && md5(password || "") === expectedPasswordHash) {
        setAuthState(true);
      }
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    consumeLoginParams();

    if (getAuthState()) {
      showPortal();
    }

    document.getElementById("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const error = document.getElementById("loginError");
      if (md5(username) === expectedUserHash && md5(password) === expectedPasswordHash) {
        setAuthState(true);
        error.textContent = "";
        showPortal();
        return;
      }
      error.textContent = "账号或密码不正确，请重新输入。";
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      setAuthState(false);
      document.getElementById("password").value = "";
      showLogin();
    });
  </script>
</body>
</html>
